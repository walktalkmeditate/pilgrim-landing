          p.replace(/\/index\.html$/, '/').replace(/\.html$/, '')
          + location.search + location.hash);
      }
    })();

<body>

  <div class="breathe-wash" id="breathe-wash" aria-hidden="true"></div>
  <div class="breathe-moon" id="breathe-moon" aria-hidden="true"></div>

  <main>

    <h1>Now.</h1>

    <section class="active" aria-live="polite">
      <p class="active-line" id="active-line">
        <span class="muted">Listening for the collective…</span>
      </p>
      <p class="silent-line" id="silent-line" hidden>
        And many more walking quietly, who chose not to be counted.
      </p>
    </section>

    <section class="streak" id="streak-section" hidden>
      <p class="streak-line" id="streak-line"></p>
    </section>

    <section class="cumulative" id="cumulative-section" aria-live="polite" hidden>
      <p class="cumulative-line" id="cumulative-line"></p>
      <p class="milestone-line" id="milestone-line"></p>
    </section>

  </main>

  <footer>
    <p>pilgrim · a walking companion · pilgrimapp.org</p>
    <p class="almanac-index">
      <a href="/sunpath" data-umami-event="footer-instrument-sunpath">Sun Path</a> ·
      <a href="/moonpath" data-umami-event="footer-instrument-moonpath">Moon Path</a> ·
      <a href="/daylight" data-umami-event="footer-instrument-daylight">Daylight</a>
    </p>
    <p class="now-credit"><em>route data: <a href="https://github.com/walktalkmeditate/open-pilgrimages" target="_blank" rel="noopener noreferrer">open-pilgrimages</a> &middot; ODbL</em></p>
  </footer>

  <script src="js/moon.js"></script>
  <script src="js/breathe-tint.js"></script>
  <script src="js/breathe.js"></script>
  <script src="js/collective-routes.js"></script>
  <script>
    (function () {
      var COLLECTIVE = null;
      var assetSettled = false;
      var pendingData = null;
      var lastKey = null;

      // Same two-source read as the homepage: the CDN copy is what
      // `scripts/publish-collective-routes` updates, the committed copy is the
      // fallback that keeps this page rendering when the CDN is unreachable or
      // sends no CORS header for this origin.
      var ROUTES_CDN = 'https://cdn.pilgrimapp.org/collective/routes.json';
      var ROUTES_LOCAL = '/assets/collective-routes.json';

      function fetchRoutes(url) {
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        });
      }

      fetchRoutes(ROUTES_CDN)
        .catch(function () { return fetchRoutes(ROUTES_LOCAL); })
        .then(function (a) { COLLECTIVE = a; })
        .catch(function () { /* both copies unavailable — COLLECTIVE stays null, static fallback renders */ })
        .then(function () {
          assetSettled = true;
          if (pendingData) render(pendingData);
        });

      function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

      function el(tag, text) {
        var e = document.createElement(tag);
        if (text != null) e.textContent = text;
        return e;
      }

      function renderActive(active) {
        var line = document.getElementById('active-line');
        var silent = document.getElementById('silent-line');
        if (active > 0) {
          line.replaceChildren(
            document.createTextNode('About '),
            el('strong', String(active)),
            document.createTextNode(' people walking with you, right now.')
          );
          silent.hidden = false;
        } else {
          line.replaceChildren(
            document.createTextNode('The path is quiet on the counter right now.'),
            el('br'),
            document.createTextNode('Many are walking quietly anyway, who chose not to be counted.'),
            el('br'),
            el('em', 'You could be one of them.')
          );
          silent.hidden = true;
        }
      }

      function renderStreak(days) {
        var section = document.getElementById('streak-section');
        var line = document.getElementById('streak-line');
        if (days && days > 0) {
          line.textContent = 'Someone has walked every day for ' + days + ' days in a row.';
          section.hidden = false;
        } else {
          section.hidden = true;
        }
      }

      function renderCumulative(walks, distanceKm) {
        var section = document.getElementById('cumulative-section');
        var line = document.getElementById('cumulative-line');
        var milestone = document.getElementById('milestone-line');

        if (!walks || walks <= 0) {
          section.hidden = true;
          return;
        }

        var m = null;
        var crossed = [];

        if (COLLECTIVE && isFinite(distanceKm)) {
          m = CollectiveRoutes.select(distanceKm, new Date(), COLLECTIVE);

          if (distanceKm > 0) {
            try {
              var KEY = 'pilgrim.collective.lastSeenKm';
              var prev = parseFloat(localStorage.getItem(KEY));
              crossed = CollectiveRoutes.crossingsSince(prev, distanceKm, COLLECTIVE);
              if (!(prev >= 0) || distanceKm >= prev) localStorage.setItem(KEY, String(distanceKm));
            } catch (e) { /* localStorage unavailable — skip crossings */ }
          }
        }

        var key = fmt(walks) + '|' + (m ? m.label : '') + '|' + (m && m.seasonLine || '') + '|' +
          (m && m.reflection || '') + '|' + (m && m.annualLine || '') + '|' + crossed.join(',');
        if (key === lastKey) return;
        lastKey = key;

        line.replaceChildren(
          document.createTextNode('Since launch, '),
          el('strong', fmt(walks)),
          document.createTextNode(' walks have been taken with the collective.')
        );

        var nodes = [];
        if (m) {
          nodes.push(document.createTextNode(m.label));
          if (m.seasonLine) { nodes.push(el('br')); nodes.push(document.createTextNode(m.seasonLine)); }
          if (m.reflection) { nodes.push(el('br')); nodes.push(el('em', m.reflection)); }
          if (m.annualLine) { nodes.push(el('br')); nodes.push(document.createTextNode(m.annualLine)); }
          if (m.daylightHref) {
            nodes.push(el('br'));
            var a = document.createElement('a'); a.href = m.daylightHref; a.textContent = 'find its light →';
            nodes.push(a);
          }
          crossed.forEach(function (nameEn) {
            nodes.push(el('br'));
            nodes.push(document.createTextNode('Since you were last here, together we completed the ' + nameEn + '.'));
          });
        } else {
          nodes.push(document.createTextNode('The path is beginning.'));
        }
        milestone.replaceChildren.apply(milestone, nodes);

        section.hidden = false;
      }

      function render(d) {
        renderActive(d.estimated_active || 0);
        renderStreak(d.streak_days || 0);
        renderCumulative(d.total_walks || 0, d.total_distance_km || 0);
      }

      function fetchNow() {
        fetch('https://walk.pilgrimapp.org/api/now', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!assetSettled) { pendingData = d; return; }
            render(d);
          })
          .catch(function () { /* keep last render */ });
      }

      fetchNow();
      setInterval(fetchNow, 30000);
    })();
  </script>

</body>
</html>
