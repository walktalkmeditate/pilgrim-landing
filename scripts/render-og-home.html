<!DOCTYPE html>
<!--
  Renders assets/og-image.png (1200×630): a still of the homepage's field,
  painted by the hero's own js/hero-field.js, so the card someone sees in a
  feed is the painting that comes alive when they click.

  The clock is held before dawn on the full moon of October 2026, the
  morning the field was first painted: the moon is setting into the grass
  in the west, after the Musashino screens. Night, because a pale card
  vanishes in a light feed. ?at= and ?theme= override both, for trying
  another hour.

  From repo root — WebGL needs a GPU or SwiftShader, so no --disable-gpu.
  TZ pins the held clock's daylight saving, which moves the moon an hour:
    TZ=America/Chicago "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --use-angle=swiftshader --enable-unsafe-swiftshader \
      --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,670 \
      --screenshot=/tmp/og-home-raw.png \
      --virtual-time-budget=6000 \
      "file://$(pwd)/scripts/render-og-home.html"
    magick /tmp/og-home-raw.png -crop 1200x630+0+0 +repage -strip \
      -define png:compression-level=9 -define png:compression-filter=5 assets/og-image.png
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Render og-image</title>
  <script>
    (function () {
      var at = new URLSearchParams(location.search).get('at') || '2026-10-26T05:55:00';
      var shift = new Date(at).getTime() - Date.now();
      var RealDate = Date;
      function HeldDate(a, b, c, d, e, f, g) {
        if (!(this instanceof HeldDate)) return new RealDate(RealDate.now() + shift).toString();
        var n = arguments.length;
        if (n === 0) return new RealDate(RealDate.now() + shift);
        if (n === 1) return new RealDate(a);
        return new RealDate(a, b || 0, c === undefined ? 1 : c, d || 0, e || 0, f || 0, g || 0);
      }
      HeldDate.prototype = RealDate.prototype;
      HeldDate.now = function () { return RealDate.now() + shift; };
      HeldDate.UTC = RealDate.UTC;
      HeldDate.parse = RealDate.parse;
      window.Date = HeldDate;
      var theme = new URLSearchParams(location.search).get('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --parchment: #F5F0E8; --ink: #2C241E; --stone: #8B7355; --ink-fog: #5E5953; }
    [data-theme="dark"] { --parchment: #1C1914; --ink: #F0EBE1; --stone: #B8976E; --ink-fog: #908A83; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--parchment); }
    .hero { position: relative; width: 1200px; height: 630px; overflow: hidden; }
    .hero-field { position: absolute; inset: 0; width: 100%; height: 100%; }
    .card { position: absolute; left: 100px; top: 92px; z-index: 1; }
    .kicker {
      font-family: Lato, sans-serif; font-weight: 400; font-size: 17px;
      letter-spacing: 5px; color: var(--ink-fog); margin-bottom: 18px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 132px;
      line-height: 0.95; letter-spacing: 1px; color: var(--ink);
    }
    .tagline {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400;
      font-size: 40px; color: var(--stone); margin-top: 14px;
    }
    /* The field reads the bottom of .hero-quotes to set its horizon. */
    .hero-quotes { position: absolute; left: 0; top: 205px; height: 1px; width: 1px; }
  </style>
</head>
<body>
  <header class="hero" data-moon-scale="2.1">
    <div class="card">
      <p class="kicker">PILGRIMAPP.ORG</p>
      <h1>Pilgrim</h1>
      <p class="tagline">a walking practice</p>
    </div>
    <div class="hero-quotes"></div>
  </header>
  <script src="../js/moon.js"></script>
  <script src="../js/hero-field-core.js"></script>
  <script src="../js/hero-field.js"></script>
</body>
</html>
